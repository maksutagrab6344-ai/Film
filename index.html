

<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук фільмів</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-layout">

        <!-- Пошук фільмів -->
        <section class="container">

            <h3>ПОШУК ФІЛЬМІВ</h3>

            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    aria-label="Назва фільму"
                    placeholder="Введи назву фільму..."
                >

                <button
                    type="button"
                    id="searchBtn"
                    class="search-icon"
                    aria-label="Знайти фільм"
                >⌕</button>

            </div>

            <div class="movie" id="movie">

                <img
                    class="poster"
                    src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6M9XBx.jpg"
                    alt="Постер фільму «Інтерстеллар»"
                >

                <h2>Інтерстеллар</h2>

                <div class="rating">
                    <span class="star">★</span>
                    <b>8.7</b> / 10 IMDb
                </div>

                <p class="description">
                    Коли Земля стає непридатною для життя,
                    колишній пілот Купер залишає родину
                    й вирушає з командою дослідників шукати
                    новий дім для людства.
                </p>

                <a
                    id="movieLink"
                    class="movie-link"
                    href="https://www.imdb.com/title/tt0816692/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Сторінка фільму IMDb ↗
                </a>

                <button id="addToLibrary" class="add-button" type="button">
                    + Додати до бібліотеки
                </button>

            </div>

            <div class="not-found" id="notFound" role="status"></div>

        </section>

        <!-- Бібліотека справа -->
        <aside class="library">

            <h2>МОЯ БІБЛІОТЕКА</h2>
            <p class="library-subtitle">Твої збережені фільми</p>

            <div id="libraryList" class="library-list">
                <p class="empty-library">Тут поки немає фільмів</p>
            </div>

        </aside>

    </main>

    <script src="script.js"></script>

</body>
</html>
